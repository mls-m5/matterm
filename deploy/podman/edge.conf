# nginx inside the `edge` container: the only container with a published port.
# It forwards to matterm-server on the internal network. TLS is not handled
# here; on the public server the host's nginx terminates it (nginx-host.conf.example).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 16k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://matterm:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Appends this hop's peer address; matterm-server counts hops from the
        # right (trusted_proxy_hops), so a client-supplied prefix is ignored.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
