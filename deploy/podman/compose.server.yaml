# Overrides for the public server. Use together with compose.yaml:
#
#   export MATTERM_DOMAIN=term.example.org MATTERM_PORT=8081
#   podman compose -f deploy/podman/compose.yaml \
#                  -f deploy/podman/compose.server.yaml up -d
#
# The host's own nginx terminates TLS (see nginx-host.conf.example) and
# forwards to 127.0.0.1:${MATTERM_PORT}; nothing else is published. Do this
# only after the hardening phases in docs/WEB_TERMINAL.md, and review the rate
# limiting configuration first.

services:
  matterm:
    # A command list replaces the base file's, so it is complete here.
    command:
      - --listen
      - 0.0.0.0
      - --port
      - "8080"
      - --allow-plain-http
      - --origin
      - https://${MATTERM_DOMAIN:?set MATTERM_DOMAIN}
      - --static-dir
      - /usr/share/matterm/web
      # Safe ONLY while this port is published on host loopback, the container
      # network is isolated, and nginx is the only caller. Prefer an exact
      # proxy IP if the container gateway address is known and stable.
      - --trusted-proxy
      - any
      - --trusted-proxy-hops
      - "0"
      # nginx overwrites X-Forwarded-For with $remote_addr (one address).
