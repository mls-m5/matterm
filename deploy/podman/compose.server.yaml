# Overrides for the public server. Use together with compose.yaml:
#
#   export MATTERM_DOMAIN=term.example.org MATTERM_PORT=8081
#   podman compose -f deploy/podman/compose.yaml \
#                  -f deploy/podman/compose.server.yaml up -d
#
# The host's own nginx terminates TLS (see nginx-host.conf.example) and
# forwards to 127.0.0.1:${MATTERM_PORT}; nothing else is published. Do this
# only after the hardening phases in docs/WEB_TERMINAL.md, and review the rate
# limiting configuration first.

services:
  matterm:
    command:
      - --listen=0.0.0.0:8080
      - --allow-plain-http
      # Only the host's nginx can reach the loopback-published port, so its
      # X-Forwarded-For is trusted regardless of the peer address Podman shows.
      - --trusted-proxy=any
      - --trusted-proxy-hops=1
      - --allowed-origin=https://${MATTERM_DOMAIN:?set MATTERM_DOMAIN}
