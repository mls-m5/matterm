<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>matterm</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<form id="login" autocomplete="off">
  <h1>matterm</h1>
  <input id="password" type="password" placeholder="Password" autofocus>
  <button type="submit">Log in</button>
  <p id="message" role="alert"></p>
</form>
<!-- The terminal window: the canvas fills it, its CSS size is the grid. On wide
     desktop viewports it is a framed panel; elsewhere it is edge to edge. -->
<main id="window" hidden>
  <canvas id="canvas" tabindex="-1"></canvas>
  <button id="layout" type="button" aria-pressed="false"
    title="Toggle full screen" aria-label="Toggle full screen">&#x2922;</button>
</main>
<!-- Touch devices: a focusable field brings up the on-screen keyboard, and the
     bar adds the keys a phone keyboard lacks. Shown only for coarse pointers. -->
<textarea id="softkeys" hidden autocapitalize="off" autocomplete="off"
  autocorrect="off" spellcheck="false" aria-label="Terminal input"></textarea>
<div id="keybar" hidden>
  <button type="button" data-key="Escape">Esc</button>
  <button type="button" data-key="Tab">Tab</button>
  <button type="button" data-mod="ctrl" aria-pressed="false">Ctrl</button>
  <button type="button" data-mod="alt" aria-pressed="false">Alt</button>
  <button type="button" data-prefix hidden aria-pressed="false" title="Tabs and panes: Ctrl+B, then a key">^B</button>
  <button type="button" data-key="ArrowUp">&uarr;</button>
  <button type="button" data-key="ArrowDown">&darr;</button>
  <button type="button" data-key="ArrowLeft">&larr;</button>
  <button type="button" data-key="ArrowRight">&rarr;</button>
  <button type="button" data-text="|">|</button>
  <button type="button" data-text="/">/</button>
  <button type="button" data-text="-">-</button>
  <button type="button" data-text="~">~</button>
</div>
<script src="login.js"></script>
</body>
</html>
